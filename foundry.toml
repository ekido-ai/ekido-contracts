[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../docs/schemas/vectors" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false
